<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>KPI Pensyarah</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: ledger-style app shell — sidebar index of 10 modules on desktop, scrolling tab strip on phone; main pane of cards */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E8EAF1; --line:#D8DBE6; --fg:#1A1F33; --muted:#5D6379;
  --ink:#2D3F8F; --ink-2:#1F2E6E; --ink-soft:#E2E6F6; --gold:#9C7019; --gold-soft:#F4EAD4;
  --ok:#23704F; --ok-soft:#DDF0E6; --warn:#A65F00; --warn-soft:#FAEACF; --bad:#B1261E; --bad-soft:#F8DEDB;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --shadow:0 1px 2px rgba(26,31,51,.06), 0 4px 14px rgba(26,31,51,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10121A; --surface:#191C27; --sunk:#222634; --line:#2D3244; --fg:#E6E8F1; --muted:#9AA0B6;
  --ink:#97A8F2; --ink-2:#B9C5FA; --ink-soft:#242B4A; --gold:#D8AE57; --gold-soft:#372D1C;
  --ok:#5CC08E; --ok-soft:#163226; --warn:#E5A241; --warn-soft:#382911; --bad:#EF7B71; --bad-soft:#3C1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#10121A; --surface:#191C27; --sunk:#222634; --line:#2D3244; --fg:#E6E8F1; --muted:#9AA0B6;
  --ink:#97A8F2; --ink-2:#B9C5FA; --ink-soft:#242B4A; --gold:#D8AE57; --gold-soft:#372D1C;
  --ok:#5CC08E; --ok-soft:#163226; --warn:#E5A241; --warn-soft:#382911; --bad:#EF7B71; --bad-soft:#3C1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.seal{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:13px;letter-spacing:.02em;flex:none}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.navgrp{margin:14px 0 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--ink-soft);color:var(--ink-2);font-weight:650}
.nav .no{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:20px}
.nav a.on .no{color:var(--ink)}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mode{margin-top:18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* main */
.main{min-width:0;padding-block:20px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.top .eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:4px}
.top p{margin:4px 0 0;color:var(--muted);max-width:65ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.pri:hover{background:var(--ink-2)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
select.ctl,input.ctl,textarea.ctl{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
textarea.ctl{resize:vertical;min-height:70px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card h2 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
/* hero ring */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:var(--f-display);font-size:36px;font-weight:800;line-height:1}
.ring .v span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border-left:2px solid var(--line);padding:2px 0 2px 12px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .n{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1}
.stat .n small{font-family:var(--f-mono);font-size:13px;font-weight:400;color:var(--muted)}
.stat .s{font-size:12px;color:var(--muted)}
/* bars */
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.kpirow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.kpirow:last-child{border-bottom:0}
.kpirow .lbl{font-weight:550;min-width:0}
.kpirow .val{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.kpirow .bar{grid-column:1/-1}
.modtag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.ink{background:var(--ink-soft);color:var(--ink-2)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
/* urgent */
.urg{display:flex;flex-direction:column}
.urg .it{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.urg .it:last-child{border-bottom:0}
.urg .stripe{align-self:stretch;border-radius:3px;background:var(--line)}
.urg .stripe.bad{background:var(--bad)} .urg .stripe.warn{background:var(--warn)} .urg .stripe.ok{background:var(--ok)}
.urg .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urg .d{font-size:12px;color:var(--muted)}
/* pipeline */
.pipe{display:flex;height:30px;border-radius:7px;overflow:hidden;background:var(--sunk);margin:6px 0 10px}
.pipe span{display:grid;place-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--surface);font-weight:600;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* module overview */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mod{border:1px solid var(--line);border-radius:9px;padding:11px 12px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:6px;min-width:0}
.mod:hover{border-color:var(--ink)}
.mod .h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mod .h b{font-family:var(--f-display);font-size:14.5px}
.mod .h span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mod .m{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
/* record list */
.list{display:flex;flex-direction:column;gap:8px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:start}
.rec .ti{font-weight:650;font-size:15px;min-width:0;overflow-wrap:anywhere}
.rec .sb{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.rec .chips{display:flex;flex-wrap:wrap;gap:5px;grid-column:1/-1}
.rec .pr{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.rec .pr .num{font-size:12px;color:var(--muted)}
.rec .act{display:flex;gap:4px;align-items:center}
.ev{font-size:12px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ev.none{color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .ctl{flex:1 1 200px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.strip .stat{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:8px;padding:10px 12px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:17px;margin-bottom:6px}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-height:240px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--ink);outline-offset:-2px}
.col h3{font-size:13.5px;font-family:var(--f-body);font-weight:700;display:flex;justify-content:space-between;padding:2px 4px 4px}
.col h3 span{font-family:var(--f-mono);font-weight:400;color:var(--muted)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.task.dragging{opacity:.45}
.task .tt{font-weight:600;overflow-wrap:anywhere}
.task .row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.task .mv{display:flex;justify-content:space-between;align-items:center}
.pri-Tinggi{border-left:3px solid var(--bad)} .pri-Sederhana{border-left:3px solid var(--warn)} .pri-Rendah{border-left:3px solid var(--ok)}
/* habit */
.hab{overflow-x:auto}
.hab table{border-collapse:collapse;width:100%;min-width:520px}
.hab th,.hab td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);font-size:12.5px}
.hab th:first-child,.hab td:first-child{text-align:left;font-weight:600;padding-right:10px}
.hab th.today{color:var(--ink)}
.tick{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;font-weight:800;color:var(--surface)}
.tick.on{background:var(--ok);border-color:var(--ok)}
/* tables */
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;min-width:560px}
.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13.5px}
.tbl th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}
.tbl td.r,.tbl th.r{text-align:right}
.tbl input.ctl{width:110px;text-align:right;padding:5px 8px}
/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(16px,4vw,40px)}
.report h2{font-size:22px;margin:22px 0 8px}
.report h3{font-size:15.5px;margin:18px 0 6px;color:var(--ink-2)}
.report .hdr{border-bottom:2px solid var(--fg);padding-bottom:12px;margin-bottom:6px}
.report ul{margin:6px 0;padding-left:20px}
.report li{margin:3px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px))}
.dlg{background:var(--surface);border-radius:14px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.dlg header{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg header h3{font-size:18px}
.dlg .bd{padding:16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dlg .bd .full{grid-column:1/-1}
.dlg footer{padding:12px 18px 16px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;font-weight:650;color:var(--muted)}
.fld .ctl{width:100%}
.fld .hint{font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;z-index:60;font-size:13.5px}
.note{background:var(--gold-soft);border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:13px}
.guide ol{padding-left:20px;margin:6px 0} .guide li{margin:6px 0;max-width:72ch}
.guide code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-weight:600;font-size:12.5px}
.seg button.on{background:var(--ink-soft);color:var(--ink-2)}
.wk{display:flex;flex-direction:column;gap:2px}
.logit{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.logit:last-child{border-bottom:0}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top, 0px);height:auto;z-index:20;border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));overflow:visible}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:21;background:var(--surface)}
  .brand{margin-bottom:8px} .brand small{display:none}
  .nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:6px 10px;background:var(--sunk)}
  .nav .cnt,.navgrp,.mode{display:none}
  .g-dash,.g2,.g3{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .hero{grid-template-columns:minmax(0,1fr);justify-items:center}
  .top h1{font-size:23px}
  .dlg .bd{grid-template-columns:minmax(0,1fr)}
  .logit{grid-template-columns:minmax(0,1fr) auto}
  .logit .dt{grid-column:1/-1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="seal">KPI</div><div><b>KPI Pensyarah</b><small id="who">Rekod prestasi akademik</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="mode" id="mode"><span class="dot" style="background:var(--muted)"></span>Memuatkan…</div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div id="modal"></div>

<script>
/* =========================================================
   SKEMA 10 MODUL
   ========================================================= */
const Y0 = new Date().getFullYear();
const MODS = [
 {id:'pengajaran', no:'01', name:'Pengajaran', en:'Teaching', due:'tarikhPortfolio',
  fields:[
   {k:'kod',l:'Kod Kursus',t:'text',req:1,ph:'cth: SSH1013'},
   {k:'nama',l:'Nama Kursus',t:'text',req:1},
   {k:'sesi',l:'Semester / Sesi',t:'text',ph:'Sem 1, 2026/2027'},
   {k:'pelajar',l:'Bilangan Pelajar',t:'number'},
   {k:'kredit',l:'Jam Kredit',t:'number'},
   {k:'portfolio',l:'Status Fail Pengajaran (Course Portfolio)',t:'select',o:['Belum Mula','Dalam Penyediaan','Lengkap','Disahkan']},
   {k:'eppp',l:'Skor e-PPP / Maklum Balas Pelajar (%)',t:'number'},
   {k:'tarikhPortfolio',l:'Tarikh Akhir Hantar Portfolio',t:'date'}],
  title:r=>`${r.kod||''} · ${r.nama||''}`, sub:r=>[r.sesi, r.pelajar&&`${r.pelajar} pelajar`, r.kredit&&`${r.kredit} kredit`].filter(Boolean).join(' · '),
  chips:r=>[r.portfolio&&[r.portfolio,['Lengkap','Disahkan'].includes(r.portfolio)?'ok':'warn'], r.eppp&&[`e-PPP ${r.eppp}%`, +r.eppp>=85?'ok':+r.eppp>=70?'ink':'bad']],
  prog:r=>({'Belum Mula':0,'Dalam Penyediaan':45,'Lengkap':85,'Disahkan':100})[r.portfolio]??0 },
 {id:'penyeliaan', no:'02', name:'Penyeliaan', en:'Supervision', due:'got', span:['tarikhDaftar','tarikhGrad'],
  fields:[
   {k:'nama',l:'Nama Pelajar',t:'text',req:1},
   {k:'peringkat',l:'Peringkat',t:'select',o:['PhD','Master','Sarjana Muda']},
   {k:'peranan',l:'Status Penyeliaan',t:'select',o:['Penyelia Utama','Penyelia Bersama']},

/* =========================================================
   STOR DATA: awan (db Artifact) atau tempatan (localStorage)
   ========================================================= */
const LS_KEY='kpiPensyarah.v1';
const ST = {mode:'loading', recs:{}, cfg:{targets:{},habits:DEFAULT_HABITS.slice(),profil:{}}, habit:{}, year:Y0, err:''};
let DB=null;
function lsRead(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){return null}}
function lsWrite(){try{localStorage.setItem(LS_KEY,JSON.stringify({recs:ST.recs,cfg:ST.cfg,habit:ST.habit}));return true}catch(e){toast('Gagal simpan dalam pelayar ini — eksport sandaran JSON segera.');return false}}
function useLocal(){
  ST.mode='local'; const d=lsRead();
  if(d){ST.recs=d.recs||{};ST.cfg=Object.assign({targets:{},habits:DEFAULT_HABITS.slice(),profil:{}},d.cfg||{});ST.habit=d.habit||{}}
  render();
}
async function initStore(){
  if(!(window.claude&&typeof window.claude.use==='function')){useLocal();return}
  let db=null; try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){useLocal();return}
  DB=db; let got=false;
  const timer=setTimeout(()=>{if(!got){ST.mode='error';ST.err='Data awan tidak dapat dimuatkan dalam 10 saat. Muat semula halaman, atau guna mod tempatan.';render()}},10000);
  const fail=e=>{clearTimeout(timer);ST.mode='error';ST.err=(e&&e.code==='permission_denied')?'Anda tiada akses kepada data ini. Hanya pemilik (dan editor yang dijemput) boleh membaca rekod KPI.':'Ralat memuatkan data awan: '+((e&&e.message)||'tidak diketahui');render()};
  db.collection('kpi').onSnapshot(snap=>{got=true;clearTimeout(timer);const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({},d.data(),{id:d.id})});ST.recs=o;if(ST.mode!=='cloud'){ST.mode='cloud'}render()},fail);
  db.doc('cfg/main').onSnapshot(s=>{if(s.exists){const d=s.data();ST.cfg={targets:d.targets||{},habits:Array.isArray(d.habits)?d.habits.slice():DEFAULT_HABITS.slice(),profil:d.profil||{}}}render()},()=>{});
  db.collection('habit').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=Object.assign({},(d.data()||{}).d||{})});ST.habit=o;render()},()=>{});
}
const Store={
  async put(rec){
    rec=Object.assign({},rec); if(!rec.id)rec.id=uid(); if(!rec.dicipta)rec.dicipta=Date.now(); rec.dikemaskini=Date.now();
    ST.recs[rec.id]=rec;
    if(ST.mode==='cloud'){const {id,...body}=rec; try{await DB.collection('kpi').doc(id).set(clean(body))}catch(e){toast(errMsg(e));throw e}}
    else lsWrite();
    render(); return rec;
  },
  async del(id){
    delete ST.recs[id];
    if(ST.mode==='cloud'){try{await DB.collection('kpi').doc(id).delete()}catch(e){toast(errMsg(e))}} else lsWrite();
    render();
  },
  async cfg(){ if(ST.mode==='cloud'){try{await DB.doc('cfg/main').set(clean(ST.cfg))}catch(e){toast(errMsg(e))}} else lsWrite(); render(); },
  async habitMonth(m){ if(ST.mode==='cloud'){try{await DB.collection('habit').doc(m).set({d:ST.habit[m]||{}})}catch(e){toast(errMsg(e))}} else lsWrite(); render(); }
};
function clean(o){return JSON.parse(JSON.stringify(o,(k,v)=>v===undefined?null:v))}
function errMsg(e){const c=e&&e.code;if(c==='quota_exceeded')return'Storan penuh (had 25,000 rekod). Eksport sandaran dan padam rekod lama.';if(c==='permission_denied')return'Tiada kebenaran menulis.';return'Gagal simpan: '+((e&&e.message)||'ralat')}

/* =========================================================
   PERTANYAAN DATA
   ========================================================= */
const all = ()=>Object.values(ST.recs);
function inYear(r,y){
  if(+r.tahun===y) return true;
  const m=MOD[r.mod]; if(!m||!m.span) return false;
  if(!r.tahun||+r.tahun>y) return false;
  const end=r[m.span[1]]; return !end || +end.slice(0,4)>=y;
}
const recsOf = (mod,y=ST.year)=>all().filter(r=>r.mod===mod&&inYear(r,y));
const tasks = ()=>all().filter(r=>r.mod==='tugas');
const logs = ()=>all().filter(r=>r.mod==='log');
const refls = ()=>all().filter(r=>r.mod==='refleksi');
function target(id,y=ST.year){const t=ST.cfg.targets?.[y]; if(t&&t[id]!==undefined&&t[id]!=='')return +t[id]; return KPIS.find(k=>k.id===id).def}
function kpiRows(y=ST.year){return KPIS.map(k=>{const a=k.f(recsOf(k.mod,y),y)||0;const t=target(k.id,y);return Object.assign({},k,{a,t,p:t>0?Math.min(100,Math.round(a/t*100)):null})})}
function overall(y=ST.year){const r=kpiRows(y).filter(k=>k.p!==null);return r.length?Math.round(avg(r.map(k=>k.p))):0}
function habitRate(y){
  const H=ST.cfg.habits||[]; if(!H.length) return 0;
  let checks=0, first=null;
  Object.entries(ST.habit).forEach(([m,d])=>{if(!m.startsWith(String(y)))return;Object.entries(d||{}).forEach(([day,arr])=>{const n=(arr||[]).filter(h=>H.includes(h)).length;if(n){checks+=n;if(!first||day<first)first=day}})});
  if(!first) return 0;
  const end = y<Y0?pd(`${y}-12-31`):today();
  const days=Math.max(1,Math.round((end-pd(first))/864e5)+1);
  return Math.min(100,Math.round(checks/(days*H.length)*100));
}
function urgent(win=30){
  const out=[];
  MODS.forEach(m=>recsOf(m.id).forEach(r=>{const d=r[m.due];if(!d)return;const n=daysTo(d);if(m.prog(r)>=100)return;if(n<=win)out.push({r,m,d,n,t:m.title(r),what:(MOD[m.id].fields.find(f=>f.k===m.due)||{}).l})}));
  tasks().filter(t=>t.status!=='Selesai'&&t.tarikhAkhir).forEach(t=>{const n=daysTo(t.tarikhAkhir);if(n<=win)out.push({r:t,m:null,d:t.tarikhAkhir,n,t:t.tajuk,what:'Tugasan Kanban'+(t.modul&&MOD[t.modul]?' · '+MOD[t.modul].name:'')})});
  return out.sort((a,b)=>a.n-b.n);
}
function dueChip(d){if(!d)return'';const n=daysTo(d);if(n<0)return`<span class="chip bad">Lewat ${-n} hari</span>`;if(n===0)return`<span class="chip bad">Hari ini</span>`;if(n<=14)return`<span class="chip warn">${n} hari lagi</span>`;return`<span class="chip">${fmtD(d)}</span>`}

const modState={};
function vModule(m){
  const s=modState[m.id]||(modState[m.id]={q:'',f:''});
  let R=recsOf(m.id);
  const pg=R.length?Math.round(avg(R.map(m.prog))):0, ev=R.length?Math.round(100*R.filter(r=>r.bukti).length/R.length):0;
  const K=kpiRows().filter(k=>k.mod===m.id);
  const statusField=m.fields.find(f=>f.t==='select'&&['status','peringkat','milestone','portfolio','laporan','statusKpi'].includes(f.k)&&f.o.length>2)||m.fields.find(f=>f.t==='select');
  if(s.q){const q=s.q.toLowerCase();R=R.filter(r=>JSON.stringify(r).toLowerCase().includes(q))}
  if(s.f&&statusField)R=R.filter(r=>r[statusField.k]===s.f);
  R.sort((a,b)=>(a[m.due]||'9999').localeCompare(b[m.due]||'9999'));
  let html=head(`Modul ${m.no} · ${m.en}`,m.name,'',`<button class="btn" data-a="csv" data-mod="${m.id}">Eksport CSV</button><button class="btn pri" data-a="new" data-mod="${m.id}">+ Tambah</button>`)+
  `<div class="strip"><div class="stat"><div class="k">Rekod ${ST.year}</div><div class="n num">${recsOf(m.id).length}</div></div><div class="stat"><div class="k">Purata siap</div><div class="n num">${pg}%</div></div><div class="stat"><div class="k">Ada pautan bukti</div><div class="n num">${ev}%</div></div>${K.slice(0,3).map(k=>`<div class="stat"><div class="k">${esc(k.l)}</div><div class="n num" style="font-size:20px">${fmtVal(k.a,k.u)} <small>/ ${fmtVal(k.t,k.u)}</small></div></div>`).join('')}</div>`;
  if(m.id==='peribadi') html+=habitCard()+reflCard();

  return html;
}
function recCard(m,r){

function habitCard(){

  ${H.length?`<div class="hab"><table><thead><tr><th>Tabiat</th>${days.map((d,i)=>`<th class="${ymd(d)===t?'today':''}">${nm[i]}<br><span class="num muted">${d.getDate()}</span></th>`).join('')}<th>%</th></tr></thead><tbody>${H.map(h=>{let c=0,n=0;const cells=days.map(d=>{const k=ymd(d),on=((ST.habit[k.slice(0,7)]||{})[k]||[]).includes(h);if(d<=today()){n++;if(on)c++}return`<td><button class="tick ${on?'on':''}" data-a="habit" data-d="${k}" data-h="${esc(h)}" ${d>today()?'disabled style="opacity:.35"':''} aria-pressed="${on}" aria-label="${esc(h)} ${k}">${on?'✓':''}</button></td>`}).join('');return`<tr><td>${esc(h)}</td>${cells}<td class="num">${n?Math.round(c/n*100):0}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="muted">Tiada tabiat. Tambah di Data & Tetapan.</div>'}</section>`;

function reflCard(){

└── 00_SKT_LPPT_${ST.year}/</pre></section>`;

function fieldsFor(rec){
  if(rec.mod==='tugas') return [{k:'tajuk',l:'Tugasan',t:'text',req:1,full:1},{k:'modul',l:'Modul berkaitan',t:'select',o:['',...MODS.map(m=>m.id)],ol:['—',...MODS.map(m=>m.name)]},{k:'status',l:'Status',t:'select',o:TASK_COLS},{k:'keutamaan',l:'Keutamaan',t:'select',o:['Tinggi','Sederhana','Rendah']},{k:'tarikhAkhir',l:'Tarikh akhir',t:'date'},{k:'tahun',l:'Tahun',t:'number',req:1},{k:'bukti',l:'Pautan bukti / dokumen',t:'url',full:1},{k:'nota',l:'Catatan',t:'textarea',full:1}];
  if(rec.mod==='log') return [{k:'tarikh',l:'Tarikh',t:'date',req:1},{k:'modul',l:'Modul',t:'select',o:MODS.map(m=>m.id),ol:MODS.map(m=>m.name)},{k:'aktiviti',l:'Aktiviti',t:'textarea',req:1,full:1},{k:'jam',l:'Jam',t:'number'},{k:'tahun',l:'Tahun',t:'number',req:1},{k:'bukti',l:'Pautan bukti',t:'url',full:1}];
  if(rec.mod==='refleksi') return [{k:'minggu',l:'Minggu bermula (Isnin)',t:'date',req:1},{k:'tahun',l:'Tahun',t:'number',req:1},{k:'baik',l:'Apa yang berjalan baik?',t:'textarea',req:1,full:1},{k:'cabaran',l:'Cabaran / halangan',t:'textarea',full:1},{k:'fokus',l:'Fokus minggu depan',t:'textarea',full:1}];
  const m=MOD[rec.mod]; return [...m.fields,...COMMON(m)];
}
function openForm(rec){
  const isNew=!rec.id, F=fieldsFor(rec);
  const name=rec.mod==='tugas'?'Tugasan':rec.mod==='log'?'Log aktiviti':rec.mod==='refleksi'?'Refleksi mingguan':MOD[rec.mod].name;
  const ctl=f=>{const v=rec[f.k]??'';const id='f_'+f.k;
    if(f.t==='select')return`<select class="ctl" id="${id}">${f.k!=='modul'&&!f.o.includes(v)&&v===''?'<option value="">— pilih —</option>':''}${f.o.map((o,i)=>`<option value="${esc(o)}" ${String(v)===o?'selected':''}>${esc(f.ol?f.ol[i]:o)}</option>`).join('')}</select>`;
    if(f.t==='textarea')return`<textarea class="ctl" id="${id}" rows="3" ${f.req?'required':''}>${esc(v)}</textarea>`;
    return`<input class="ctl ${f.t==='number'?'num':''}" id="${id}" type="${f.t}" ${f.t==='number'?'step="any" min="0"':''} value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>`};
  $('#modal').innerHTML=`<div class="ov" data-a="close-ov"><form class="dlg" id="recForm" role="dialog" aria-modal="true" aria-labelledby="dlgT">
   <header><h3 id="dlgT">${isNew?'Tambah':'Sunting'} · ${esc(name)}</h3><button type="button" class="btn ghost" data-a="close" aria-label="Tutup">✕</button></header>
   <div class="bd">${F.map(f=>`<div class="fld ${f.full||f.t==='textarea'?'full':''}"><label for="f_${f.k}">${esc(f.l)}${f.req?' *':''}</label>${ctl(f)}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`).join('')}</div>
   <footer>${isNew?'':`<button type="button" class="btn danger" data-a="ask-del" style="margin-right:auto">Padam</button>`}<button type="button" class="btn" data-a="close">Batal</button><button class="btn pri" type="submit">Simpan</button></footer></form></div>`;
  const form=$('#recForm');
  form.addEventListener('submit',async e=>{e.preventDefault();const out=Object.assign({},rec);F.forEach(f=>{let v=$('#f_'+f.k).value.trim();if(f.t==='number')v=v===''?'':+v;out[f.k]=v});if(out.contoh&&!isNew)delete out.contoh;try{await Store.put(out);closeModal();toast(isNew?'Rekod ditambah':'Rekod dikemas kini')}catch(err){}});
  form.querySelector('[data-a="ask-del"]')?.addEventListener('click',()=>confirmBox('Padam rekod ini?',`"${esc(rec.tajuk||rec.aktiviti||(MOD[rec.mod]?MOD[rec.mod].title(rec):'rekod'))}" akan dipadam secara kekal.`,'Padam',async()=>{await Store.del(rec.id);toast('Rekod dipadam')}));
  setTimeout(()=>form.querySelector('input,select,textarea')?.focus(),30);
}
function closeModal(){$('#modal').innerHTML=''}
function confirmBox(title,msg,okLabel,onOk){

function quickPick(){

let toastT; function toast(s){clearTimeout(toastT);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=s;toastT=setTimeout(()=>t.remove(),2600)}

/* =========================================================
   EKSPORT / IMPORT
   ========================================================= */
async function saveFile(filename,text,mime){
  let dl=null; try{dl=window.claude&&typeof window.claude.use==='function'?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename,data:new Blob([text],{type:mime})});toast('Fail disimpan');return}catch(e){if(e&&e.code==='declined'){toast('Muat turun dibatalkan');return}}}
  let url=''; try{url=URL.createObjectURL(new Blob([text],{type:mime}))}catch(e){}
  $('#modal').innerHTML=`<div class="ov" data-a="close-ov"><div class="dlg" role="dialog" aria-modal="true"><header><h3>${esc(filename)}</h3><button class="btn ghost" data-a="close" aria-label="Tutup">✕</button></header><div style="padding:14px 18px;display:flex;flex-direction:column;gap:10px"><p class="small muted" style="margin:0">Muat turun terus mungkin disekat dalam paparan ini. Salin kandungan di bawah dan tampal ke fail baharu bernama <b>${esc(filename)}</b>, atau cuba pautan muat turun.</p><textarea class="ctl mono" id="expTxt" rows="12" readonly>${esc(text)}</textarea></div><footer>${url?`<a class="btn" href="${url}" download="${esc(filename)}">Muat turun</a>`:''}<button class="btn pri" id="cpBtn">Salin</button></footer></div></div>`;
  $('#cpBtn').addEventListener('click',async()=>{const ta=$('#expTxt');try{await navigator.clipboard.writeText(text);toast('Disalin ke papan klip')}catch(e){ta.focus();ta.select();try{document.execCommand('copy');toast('Disalin')}catch(_){toast('Pilih semua teks dan salin secara manual')}}});
}
function csvFor(mods){
  const rows=[];
  mods.forEach(m=>{const F=[...m.fields,...COMMON(m)];rows.push(['Modul',...F.map(f=>f.l),'Kemajuan %']);recsOf(m.id).forEach(r=>rows.push([m.name,...F.map(f=>r[f.k]??''),m.prog(r)]));rows.push([])});
  return '﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
}
function backupJSON(){return JSON.stringify({app:'kpi-pensyarah',versi:1,dieksport:new Date().toISOString(),recs:all(),cfg:ST.cfg,habit:ST.habit},null,1)}
async function importJSON(text){
  let d; try{d=JSON.parse(text)}catch(e){toast('Fail bukan JSON yang sah');return}
  if(!d||d.app!=='kpi-pensyarah'||!Array.isArray(d.recs)){toast('Fail ini bukan sandaran KPI Pensyarah');return}
  toast(`Mengimport ${d.recs.length} rekod…`);
  if(d.cfg){ST.cfg=Object.assign({targets:{},habits:DEFAULT_HABITS.slice(),profil:{}},d.cfg)}
  if(d.habit){Object.assign(ST.habit,d.habit)}
  if(ST.mode==='cloud'){
    for(let i=0;i<d.recs.length;i+=15){await Promise.all(d.recs.slice(i,i+15).map(r=>{const id=r.id||uid();const {id:_x,...b}=r;ST.recs[id]=Object.assign({},r,{id});return DB.collection('kpi').doc(id).set(clean(b)).catch(()=>{})}))}
    await Store.cfg(); for(const m of Object.keys(d.habit||{})) await DB.collection('habit').doc(m).set({d:ST.habit[m]}).catch(()=>{});
  } else { d.recs.forEach(r=>{ST.recs[r.id||uid()]=r}); lsWrite(); }
  render(); toast(`${d.recs.length} rekod diimport`);
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a;
  if(a==='close-ov'&&e.target!==b) return;
  switch(a){
   case 'close': case 'close-ov': closeModal(); break;
   case 'quick': quickPick(); break;
   case 'new': openForm({mod:b.dataset.mod,tahun:ST.year}); break;
   case 'new-task': openForm({mod:'tugas',status:'Belum Mula',keutamaan:'Sederhana',tahun:ST.year,modul:kanFilter}); break;
   case 'new-refl': openForm({mod:'refleksi',minggu:ymd(mondayOf(new Date())),tahun:ST.year}); break;
   case 'edit': {const r=ST.recs[b.dataset.id]; if(r) openForm(r); break}
   case 'mv': {const t=ST.recs[b.dataset.id];const i=TASK_COLS.indexOf(t.status||'Belum Mula')+ +b.dataset.d;if(TASK_COLS[i])Store.put(Object.assign({},t,{status:TASK_COLS[i]}));break}
   case 'habit': {const d=b.dataset.d,h=b.dataset.h,m=d.slice(0,7);const mo=ST.habit[m]=Object.assign({},ST.habit[m]||{});const arr=(mo[d]||[]).slice();const i=arr.indexOf(h);i>=0?arr.splice(i,1):arr.push(h);mo[d]=arr;Store.habitMonth(m);break}
   case 'evf': evFilter=b.dataset.v; render(); break;
   case 'copy-targets': {const src=ST.cfg.targets?.[ST.year-1];if(!src){toast(`Tiada sasaran tersimpan untuk ${ST.year-1}`);break}ST.cfg.targets=Object.assign({},ST.cfg.targets,{[ST.year]:Object.assign({},src)});await Store.cfg();toast('Sasaran disalin');break}
   case 'csv': saveFile(`kpi-${b.dataset.mod}-${ST.year}.csv`,csvFor([MOD[b.dataset.mod]]),'text/csv'); break;
   case 'exp-csv-all': saveFile(`kpi-semua-modul-${ST.year}.csv`,csvFor(MODS),'text/csv'); break;
   case 'exp-html': saveFile(`laporan-prestasi-${ST.year}.html`,reportHTML(reportData(),true),'text/html'); break;
   case 'exp-md': saveFile(`laporan-prestasi-${ST.year}.md`,reportMD(reportData()),'text/markdown'); break;
   case 'exp-json': saveFile(`sandaran-kpi-pensyarah-${ymd(today())}.json`,backupJSON(),'application/json'); break;
   case 'save-habits': ST.cfg.habits=$('#habList').value.split('\n').map(s=>s.trim()).filter(Boolean); await Store.cfg(); toast('Tabiat disimpan'); break;
   case 'load-sample': {const S=sampleRecs();for(const r of S){if(!ST.recs[r.id])await Store.put(r)}toast('Data contoh dimuatkan');break}
   case 'del-sample': confirmBox('Padam semua rekod contoh?','Hanya rekod bertanda "Contoh" akan dipadam. Rekod sebenar anda tidak terjejas.','Padam contoh',async()=>{for(const r of all().filter(r=>r.contoh))await Store.del(r.id);toast('Rekod contoh dipadam')}); break;
   case 'del-all': confirmBox('Padam SEMUA rekod?','Tindakan ini tidak boleh diundur. Eksport sandaran JSON dahulu jika perlu.','Padam semua',async()=>{for(const r of all())await Store.del(r.id);toast('Semua rekod dipadam')}); break;
   case 'go-local': useLocal(); break;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='yearSel'){ST.year=+t.value;render()}
  else if(t.id==='kanF'){kanFilter=t.value;render()}
  else if(t.id==='mf'){modState[t.dataset.mod].f=t.value;render()}
  else if(t.dataset.target){const y=ST.year;const cur=Object.assign({},...KPIS.map(k=>({[k.id]:target(k.id,y)})),ST.cfg.targets?.[y]||{});cur[t.dataset.target]=t.value===''?'':+t.value;ST.cfg.targets=Object.assign({},ST.cfg.targets,{[y]:cur});await Store.cfg();toast('Sasaran disimpan')}
  else if(t.id==='impFile'&&t.files[0]){const fr=new FileReader();fr.onload=()=>importJSON(fr.result);fr.readAsText(t.files[0]);t.value=''}
});

});
